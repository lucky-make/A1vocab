function getResults(){return read(KEYS.results,{})}
function saveDay(day,res){var all=getResults();all[String(day)]=Object.assign(all[String(day)]||{},res);write(KEYS.results,all)}

// ---- navigation ----
document.querySelectorAll(".nav-btn").forEach(function(b){b.addEventListener("click",function(){showView(b.dataset.view)})});
document.querySelectorAll("[data-goto]").forEach(function(b){b.addEventListener("click",function(){showView(b.dataset.goto)})});
function showView(name){
  document.querySelectorAll(".view").forEach(function(v){v.classList.remove("active")});
  document.querySelectorAll(".nav-btn").forEach(function(b){b.classList.toggle("active",b.dataset.view===name)});
  $("view-"+name).classList.add("active");
  if(name==="dashboard")renderDashboard();
  if(name==="lesson")renderLesson();
  if(name==="review")startReview();
  if(name==="quiz")startQuiz();
}

// ---- dashboard ----
function renderDashboard(){
  var day=profile.current_day,plan=curriculum.days[String(day)];
  var wordsSeen=new Set(states.filter(function(s){return s.reps>0}).map(function(s){return s.card_id})).size;
  $("stat-day").textContent=day;$("stat-streak").textContent=profile.streak_days;$("stat-level").textContent=plan.level;$("stat-words").textContent=wordsSeen;
  var pct=Math.round(day/116*100);$("progress-fill").style.width=pct+"%";$("progress-text").textContent=pct+"%";
  var newCount=cards.filter(function(c){return c.introduced_day<=day&&!states.find(function(s){return s.card_id===c.id})}).length;
  var dueCount=states.filter(function(s){return s.reps>0&&s.due_at<=toISO(new Date())}).length;
  $("today-overview").innerHTML="<h3>Day "+day+" — "+plan.grammar.topic+"</h3>"+
    "<p><b>Vocab themes:</b> "+(plan.vocabThemes||[]).join(", ")+"</p>"+
    "<p><b>New cards:</b> "+newCount+" &nbsp; <b>Reviews due:</b> "+dueCount+"</p>"+
    "<p><b>Writing:</b> "+plan.writingTask+"</p>"+
    "<p><b>Targets:</b> "+plan.targets.newWords+" new words · "+plan.targets.writingWords+" words writing · "+plan.targets.readingMinutes+"m reading</p>";
}
$("start-lesson").addEventListener("click",function(){showView("lesson")});
$("reset-data").addEventListener("click",function(){
  if(confirm("Reset ALL progress?")){Object.keys(KEYS).forEach(function(k){localStorage.removeItem(KEYS[k])});profile=read(KEYS.profile,{current_day:1,streak_days:0,start_date:null});states=[];renderDashboard()}
});

// ---- lesson ----
function renderLesson(){
  var day=profile.current_day,plan=curriculum.days[String(day)];
  $("lesson-title").textContent="Day "+day+" — "+plan.level+" · Month "+plan.month;
  var g=grammar[plan.grammar.referenceId]||{rule:[],examples:[],drills:[]};
  var ruleHtml=(g.rule||[]).map(function(r){return"<li>"+r+"</li>"}).join("");
  var exHtml=(g.examples||[]).map(function(e){return"<li>"+e+"</li>"}).join("");
  var drillHtml=(g.drills||[]).map(function(d){return'<div class="drill">'+d.prompt+' <b>&rarr; '+d.answer+"</b></div>"}).join("");
  $("grammar-block").innerHTML="<h4>"+plan.grammar.topic+'</h4><ul>'+ruleHtml+'</ul><p><b>Examples:</b></p><ul>'+exHtml+'</ul><p><b>Drills:</b></p>'+drillHtml;
  var newCards=cards.filter(function(c){return c.introduced_day<=day&&!states.find(function(s){return s.card_id===c.id})}).slice(0,60);
  $("new-count").textContent=newCards.length+" new";
  $("new-cards").innerHTML=newCards.length?newCards.map(function(c){
    return'<div class="vocab-item"><div class="de">'+(c.article?c.article+" ":"")+c.front+'</div><div class="en">'+c.back+' <i>('+c.part_of_speech+')</i></div>'+(c.example_de?'<div class="ex">'+c.example_de+"</div>":"")+"</div>"
  }).join(""):'<p style="color:var(--muted)">All cards for today seen — pure review day.</p>';
  $("writing-task").textContent=plan.writingTask;
  $("writing-input").value=(getResults()[String(day)]||{}).writing_text||"";
  $("media-block").innerHTML='<p><b>Reading ('+plan.reading.level+'):</b> <a href="'+plan.reading.url+'" target="_blank" rel="noopener">'+plan.reading.source+"</a> — "+plan.reading.questions+' comprehension questions</p>'+
    '<p><b>Listening:</b> <a href="'+plan.listening.url+'" target="_blank" rel="noopener">'+plan.listening.source+"</a>"+(plan.listening.transcript?" (transcript available)":"")+"</p>";
}
$("submit-writing").addEventListener("click",function(){
  var t=$("writing-input").value.trim();
  saveDay(profile.current_day,{writing_text:t,writing_submitted:!!t});
  if(t){alert("Writing saved. Now do your Reviews!");showView("review")}else alert("Write something first!")
});

// ---- review (SM-2) ----
var reviewQueue=[],currentCard=null;
function startReview(){
  var today=toISO(new Date());
  var due=states.filter(function(s){return s.reps>0&&s.due_at<=today});
  var newC=cards.filter(function(c){return c.introduced_day<=profile.current_day&&!states.find(function(s){return s.card_id===c.id})});
  reviewQueue=[].concat(newC.map(function(c){return{card:c,isNew:true}}),due.map(function(s){return{card:cards.find(function(c){return c.id===s.card_id}),isNew:false,state:s}})).filter(function(q){return q.card});
  $("review-count").textContent=reviewQueue.length+" cards";
  $("review-done").classList.toggle("hidden",reviewQueue.length>0);
  $("flashcard").classList.remove("hidden");$("rating-buttons").classList.add("hidden");
  if(reviewQueue.length)showNextCard();
}
function showNextCard(){
  var q=reviewQueue[0];currentCard=q;
  $("card-front").textContent=q.card.front+(q.card.article?" ("+q.card.article+")":"");
  $("card-back").innerHTML="<div><b>"+q.card.back+"</b></div>"+(q.card.example_de?'<div class="ex">'+q.card.example_de+"</div>":"");
  $("flashcard").classList.remove("flipped");$("rating-buttons").classList.add("hidden");
}
$("flashcard").addEventListener("click",function(){
  if(!reviewQueue.length)return;
  $("flashcard").classList.toggle("flipped");
  if($("flashcard").classList.contains("flipped"))$("rating-buttons").classList.remove("hidden")
});
document.querySelectorAll(".rate").forEach(function(btn){
  btn.addEventListener("click",function(){
    var rating=Number(btn.dataset.rating),q=reviewQueue.shift();
    var existing=states.find(function(s){return s.card_id===q.card.id})||initialState();
    var res=rate(existing,rating);
    upsert(q.card.id,res.next);states=read(KEYS.state,[]);
    if(res.requizToday)reviewQueue.push({card:q.card,isNew:false,state:res.next});
    $("review-count").textContent=reviewQueue.length+" cards";
    if(reviewQueue.length)showNextCard();
    else{$("review-done").classList.remove("hidden");$("flashcard").classList.add("hidden");$("rating-buttons").classList.add("hidden")}
  })
});

// ---- quiz ----
var quizQuestions=[],quizIdx=0,quizScore=0;
function shuffle(a){var x=a.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t}return x}
function startQuiz(){
  var seenIds=states.filter(function(s){return s.reps>0}).map(function(s){return s.card_id});
  var pool=cards.filter(function(c){return seenIds.indexOf(c.id)>=0});
  quizQuestions=pool.length>=4?shuffle(pool).slice(0,Math.min(15,pool.length)):[];
  quizIdx=0;quizScore=0;$("quiz-result").classList.add("hidden");
  if(quizQuestions.length<4){$("quiz-question").innerHTML="<p>Complete some reviews first — you need at least 4 learned words for a quiz.</p>";$("quiz-options").innerHTML="";return}
  showQuizQuestion();
}
function showQuizQuestion(){
  var q=quizQuestions[quizIdx];
  $("quiz-progress").textContent=(quizIdx+1)+"/"+quizQuestions.length;
  $("quiz-question").innerHTML="<p style='font-size:20px'>What does <b style='color:var(--accent)'>"+q.front+"</b> mean?</p>";
  var wrongs=shuffle(cards.filter(function(c){return c.id!==q.id})).slice(0,3);
  var opts=shuffle([q].concat(wrongs));
  $("quiz-options").innerHTML=opts.map(function(o){return'<button class="quiz-option" data-correct="'+(o.id===q.id)+'">'+o.back+"</button>"}).join("");
  document.querySelectorAll(".quiz-option").forEach(function(opt){
    opt.addEventListener("click",function(){
      var correct=opt.dataset.correct==="true";
      opt.classList.add(correct?"correct":"wrong");
      if(!correct){var c=document.querySelector(".quiz-option[data-correct='true']");if(c)c.classList.add("correct")}
      if(correct)quizScore++;
      setTimeout(function(){quizIdx++;if(quizIdx<quizQuestions.length)showQuizQuestion();else finishQuiz()},900)
    },{once:true})
  })
}
function finishQuiz(){
  var pct=Math.round(quizScore/quizQuestions.length*100),passed=pct>=70;
  $("quiz-question").innerHTML="";$("quiz-options").innerHTML="";$("quiz-result").classList.remove("hidden");
  $("quiz-result").innerHTML='<div class="score">'+quizScore+"/"+quizQuestions.length+" ("+pct+"%)</div>"+
    "<p>"+(passed?"Passed! Day "+profile.current_day+" complete.":"Below 70% — review your weak cards and retake.")+"</p>"+
    (passed?"<button class='btn-primary' id='advance-day'>Advance to Day "+(profile.current_day+1)+" &rarr;</button>":"<button class='btn-primary' id='retake'>Retake Quiz</button>");
  if(passed){
    saveDay(profile.current_day,{completed_at:new Date().toISOString(),quiz_score:pct});
    profile.streak_days++;if(profile.current_day<116)profile.current_day++;write(KEYS.profile,profile);
    var ad=document.getElementById("advance-day");if(ad)ad.addEventListener("click",function(){showView("dashboard")})
  }else{var rt=document.getElementById("retake");if(rt)rt.addEventListener("click",startQuiz)}
}
renderDashboard();
})();
</script>
</body>
</html>
