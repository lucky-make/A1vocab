<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deutsch B2 — 116 Tage Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f4;--card:#ffffff;--text:#0f172a;--muted:#64748b;--accent:#297a2e;--accent2:#d97706;--danger:#dc2626;--hard:#d97706;--good:#297a2e;--easy:#0369a1;--border:rgba(15,23,42,.08);--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:48px}
h1,h2,h3,h4{font-family:'Fredoka',-apple-system,sans-serif;font-weight:600}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10}
h1{font-size:20px;color:var(--accent)}
h1 .sub{color:var(--muted);font-weight:400;font-size:14px;margin-left:8px}
nav{display:flex;gap:8px;flex-wrap:wrap}
.nav-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.nav-btn.active,.nav-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:24px 16px}
.view{display:none}.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--accent);font-family:'Fredoka',sans-serif}
.stat-label{color:var(--muted);font-size:12px;margin-top:4px}
.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.progress-bar{flex:1;height:10px;background:var(--card);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .4s}
#progress-text{color:var(--muted);font-size:13px;min-width:40px}
.card,.content-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;line-height:1.6}
.card h3,.block h3{margin-bottom:10px;font-size:16px}
.badge{background:#f0f7f0;color:var(--accent);font-size:12px;padding:2px 10px;border-radius:10px;margin-left:8px;font-weight:600}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin:8px 8px 8px 0;font-family:inherit}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:10px 20px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
.btn-ghost:hover{color:var(--danger);border-color:var(--danger)}
.block{margin-bottom:24px}
.card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vocab-item{background:#f8f9f5;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px}
.vocab-item .de{font-weight:600;color:var(--accent)}
.vocab-item .en{color:var(--muted);font-size:13px}
.vocab-item .ex{color:var(--muted);font-size:12px;margin-top:6px;font-style:italic}
textarea{width:100%;min-height:120px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px;font-family:inherit;margin:10px 0}
textarea:focus{outline:none;border-color:var(--accent)}
.flashcard{perspective:1000px;height:240px;margin:20px 0;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;padding:24px;font-size:24px;text-align:center;line-height:1.5}
.flashcard-back{transform:rotateY(180deg);background:#f0f7f0;font-size:18px;flex-direction:column;gap:12px}
.flashcard-back .ex{font-size:14px;color:var(--muted);font-style:italic}
.rating-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rate{padding:14px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;font-family:inherit}
.rate-again{background:var(--danger)}.rate-hard{background:var(--hard)}.rate-good{background:var(--good)}.rate-easy{background:var(--easy)}
.rate:hover{filter:brightness(1.1)}
.hidden{display:none!important}
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.quiz-option{background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 18px;border-radius:8px;cursor:pointer;text-align:left;font-size:15px;font-family:inherit}
.quiz-option:hover{border-color:var(--accent)}
.quiz-option.correct{background:rgba(41,122,46,.12);border-color:var(--accent)}
.quiz-option.wrong{background:rgba(220,38,38,.12);border-color:var(--danger)}
#quiz-result{margin-top:20px;text-align:center}
#quiz-result .score{font-size:32px;font-weight:700;color:var(--accent);margin:10px 0;font-family:'Fredoka',sans-serif}
a{color:var(--easy)}ul{padding-left:20px}li{margin-bottom:6px}
.drill{background:#f8f9f5;padding:8px 12px;border-radius:6px;margin:6px 0;font-size:14px}
.drill b{color:var(--accent2)}
.day-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.day-nav button{background:var(--card);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
@media(max-width:600px){.stat-row{grid-template-columns:repeat(2,1fr)}.rating-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<header>
  <h1>Deutsch B2 <span class="sub">116-Tage-Plan</span></h1>

    <button data-view="lesson" class="nav-btn">Today's Lesson</button>

    <button data-view="quiz" class="nav-btn">Quiz</button>
  </nav>
</header>
<main id="app">
  <section id="view-dashboard" class="view active">
    <div class="stat-row">

    <button id="start-lesson" class="btn-primary">Start Today's Lesson &rarr;</button>
    <button id="reset-data" class="btn-ghost">Reset all progress</button>
  </section>
  <section id="view-lesson" class="view">
    <h2 id="lesson-title">Day 1</h2>
    <div class="block"><h3>Grammar</h3><div id="grammar-block" class="content-box"></div></div>
    <div class="block"><h3>New vocabulary <span id="new-count" class="badge"></span></h3><div id="new-cards" class="card-list"></div></div>
    <div class="block"><h3>Today's writing task</h3><div id="writing-task" class="content-box"></div>
      <textarea id="writing-input" placeholder="Write your answer here… (saved locally)"></textarea>
      <button id="submit-writing" class="btn-primary">Submit writing</button></div>
    <div class="block"><h3>Reading &amp; Listening</h3><div id="media-block" class="content-box"></div></div>
  </section>
  <section id="view-review" class="view">
    <h2>Review <span id="review-count" class="badge"></span></h2>
    <div id="flashcard" class="flashcard"><div class="flashcard-inner">
      <div class="flashcard-front" id="card-front">Tap to flip</div>
      <div class="flashcard-back" id="card-back"></div>
    </div></div>
    <div id="rating-buttons" class="rating-row hidden">
      <button data-rating="1" class="rate rate-again">Again</button>
      <button data-rating="2" class="rate rate-hard">Hard</button>
      <button data-rating="3" class="rate rate-good">Good</button>
      <button data-rating="4" class="rate rate-easy">Easy</button>
    </div>
    <div id="review-done" class="hidden"><p>All reviews done for today! Head to the Quiz.</p>
      <button class="btn-primary" data-goto="quiz">Go to Quiz &rarr;</button></div>
  </section>
  <section id="view-quiz" class="view">
    <h2>Daily Quiz <span id="quiz-progress" class="badge">0/15</span></h2>
    <div id="quiz-question" class="content-box"></div>
    <div id="quiz-options" class="quiz-options"></div>
    <div id="quiz-result" class="hidden"></div>
  </section>
</main>

ing":{"source":"DW Nachrichten / Tagesschau in Einfacher Sprache","url":"https://www.tagesschau.de/inland/leichtesprache/","level":"B2","questions":7},"listening":{"source":"Coffee Break German / Tagesschau Podcast","url":"https://www.tagesschau.de/multimedia/podcast/","transcript":false},"writingTask":"Short essay (200 words) to keep hand in; relax.","targets":{"newWords":20,"reviewMinutes":35,"grammarDrills":10,"writingWords":350,"readingMinutes":30,"listeningMinutes":30},"quizMix":["vocab","collocation","connectors","essayPhrase","grammar"]},"114":{"day":114,"month":4,"level":"B2","grammar":{"topic":"Exam strategy + logistics review","referenceId":"exam-logistics"},"vocabThemes":["Practical"],"reading":{"source":"DW Nachrichten / Tagesschau in Einfacher Sprache","url":"https://www.tagesschau.de/inland/leichtesprache/","level":"B2","questions":7},"listening":{"source":"Coffee Break German / Tagesschau Podcast","url":"https://www.tagesschau.de/multimedia/podcast/","transcript":false},"writingTask":"Pack documents, confirm location/time, early sleep.","targets":{"newWords":20,"reviewMinutes":35,"grammarDrills":10,"writingWords":350,"readingMinutes":30,"listeningMinutes":30},"quizMix":["vocab","collocation","connectors","essayPhrase","grammar"]},"115":{"day":115,"month":4,"level":"B2","grammar":{"topic":"EXAM DAY — Goethe/TELC B2","referenceId":"exam-day"},"vocabThemes":["—"],"reading":{"source":"DW Nachrichten / Tagesschau in Einfacher Sprache","url":"https://www.tagesschau.de/inland/leichtesprache/","level":"B2","questions":7},"listening":{"source":"Coffee Break German / Tagesschau Podcast","url":"https://www.tagesschau.de/multimedia/podcast/","transcript":false},"writingTask":"Take the exam. You've earned it.","targets":{"newWords":20,"reviewMinutes":35,"grammarDrills":10,"writingWords":350,"readingMinutes":30,"listeningMinutes":30},"quizMix":["vocab","collocation","connectors","essayPhrase","grammar"]},"116":{"day":116,"month":4,"level":"B2","grammar":{"topic":"Post-exam: maintain B2 + plan C1","referenceId":"post-exam"},"vocabThemes":["Maintenance"],"reading":{"source":"DW Nachrichten / Tagesschau in Einfacher Sprache","url":"https://www.tagesschau.de/inland/leichtesprache/","level":"B2","questions":7},"listening":{"source":"Coffee Break German / Tagesschau Podcast","url":"https://www.tagesschau.de/multimedia/podcast/","transcript":false},"writingTask":"Set up maintenance schedule (20 min/day SM-2 + weekly group).","targets":{"newWords":20,"reviewMinutes":35,"grammarDrills":10,"writingWords":350,"readingMinutes":30,"listeningMinutes":30},"quizMix":["vocab","collocation","connectors","essayPhrase","grammar"]}}},"grammar":{"pronunciation-satzbau":{"level":"A1","rule":["Main clause: conjugated verb is ALWAYS position 2. Subject can be before or after, but verb stays at 2.","TeKaMoLo adverb order: Time → Cause → Manner → Place (heute, deshalb, gern, in Berlin).","W-question: Question-word – Verb – Subject. Yes/no: Verb – Subject.","Umlauts: ä≈eh, ö≈uh, ü≈French tu; ß=sharp s (after long vowel); v=f, w=v, z=ts, sp/st at word start = shp/sht."],"examples":["Ich lerne heute Deutsch.","Heute lerne ich Deutsch. (verb still 2nd)","Warum lernst du Deutsch?"],"drills":[{"prompt":"___ ___ ___ Deutsch. (ich / heute / lernen)","answer":"Ich lerne heute"},{"prompt":"___ ___ du Deutsch? (warum / lernen)","answer":"Warum lernst"},{"prompt":"___ ___ morgen ins Kino. (wir / gehen)","answer":"Wir gehen"},{"prompt":"___ ___ du aus? (woher / kommen)","answer":"Woher kommst"}]},"articles-plural":{"level":"A1","rule":["Every noun has gender: der (m), die (f), das (n). Plural Nominativ = die. ALWAYS learn noun+article+plural together.","Plural patterns: -e (der Tag→die Tage), -er (das Buch→die Bücher), -n/-en (die Frau→die Frauen), -s (das Auto→die Autos), umlaut only (die Mutter→die Mütter), no change (der Lehrer→die Lehrer).","Nominativ articles: der/die/das/die; ein/eine/ein (plural: keine)."],"examples":["der Mann → die Männer","die Frau → die Frauen","das Kind → die Kinder"],"drills":[{"prompt":"___ Buch ist neu. (the)","answer":"Das"},{"prompt":"___ Frauen sind hier. (the pl.)","answer":"Die"},{"prompt":"___ Mann heißt Peter. (the)","answer":"Der"},{"prompt":"Ich habe ___ Hund. (a, m)","answer":"einen"}]},"nom-akk":{"level":"A1","rule":["Nominativ = subject. Akkusativ = direct object. ONLY masculine article changes: der→den, ein→einen, mein→meinen.","Fem/neut/plural Akk look identical to Nom: die→die, das→das, die(pl)→die.","Akkusativ verbs: haben, sehen, essen, trinken, kaufen, lieben, kennen, suchen, besuchen.","Akkusativ prepositions: durch, für, ohne, um, gegen, entlang."],"examples":["Der Mann (Nom) liest die Zeitung (Akk, fem).","Ich habe einen Hund (Akk, m).","Sie kauft das Buch (Akk, n)."],"drills":[{"prompt":"Ich sehe ___ Mann. (der→Akk)","answer":"den"},{"prompt":"Wir kaufen ___ Auto. (das)","answer":"das"},{"prompt":"Er trinkt ___ Kaffee. (der)","answer":"den"},{"prompt":"Ohne ___ Geld kann ich nichts kaufen. (das)","answer":"das"}]},"praesens":{"level":"A1","rule":["Regular: stem + endings ich-e, du-st, er/sie/es-t, wir-en, ihr-t, sie/Sie-en.","Irregular core (memorize): sein (bin/bist/ist/sind/seid/sind), haben (habe/hast/hat/haben/habt/haben), werden, wissen (weiß/weißt/weiß/wissen/wisst/wissen).","Stem-change e→i/ie (du & er only): sprechen→sprichst/spricht, sehen→siehst/sieht, lesen→liest, geben→gibst/gibt, nehmen→nimmst/nimmt."],"examples":["Ich lerne, du lernst, er lernt, wir lernen.","Ich bin, du bist, er ist.","Du siehst, er sieht (e→ie)."],"drills":[{"prompt":"Ich ___ Deutsch. (lernen)","answer":"lerne"},{"prompt":"Du ___ einen Hund. (haben)","answer":"hast"},{"prompt":"Er ___ aus Berlin. (kommen)","answer":"kommt"},{"prompt":"Ihr ___ immer zu spät. (kommen)","answer":"kommt"},{"prompt":"Sie ___ Deutsch. (sprechen, er-form)","answer":"spricht"}]},"modal-1":{"level":"A1","rule":["Modal verb conjugated in position 2; main verb INFINITIVE at the END.","können (ability), müssen (obligation), wollen (desire). ich/er/sie/Sie share same form: ich kann, er kann, sie kann.","Conjugations: können: kann/kannst/kann/können/könnt/können. müssen: muss/musst/muss/müssen/müsst/müssen. wollen: will/willst/will/wollen/wollt/wollen."],"examples":["Ich muss heute lernen.","Sie kann Deutsch sprechen.","Wir wollen ins Kino gehen."],"drills":[{"prompt":"Ich ___ Deutsch sprechen. (können)","answer":"kann"},{"prompt":"Du ___ arbeiten. (müssen)","answer":"musst"},{"prompt":"Wir ___ ins Kino ___. (wollen / gehen)","answer":"wollen, gehen"},{"prompt":"Er ___ nicht kommen. (wollen)","answer":"will"}]},"modal-2":{"level":"A1","rule":["sollen (should/ought to, obligation from others), dürfen (may/allowed), mögen (like) → möchten (would like, polite).","möchten is actually Konjunktiv II of mögen but used as present polite. Conjugation: möchte/möchtest/möchte/möchten/möchtet/möchten.","dürfen: darf/darfst/darf/dürfen/dürft/dürfen. sollen: soll/sollst/soll/sollen/sollt/sollen.","Negation: nicht dürfen = must not (prohibition); nicht müssen = don't have to."],"examples":["Ich möchte einen Kaffee, bitte.","Du sollst mehr lernen.","Hier darf man nicht rauchen."],"drills":[{"prompt":"Ich ___ einen Tee. (möchten)","answer":"möchte"},{"prompt":"Du ___ mehr schlafen. (sollen)","answer":"sollst"},{"prompt":"Hier ___ man nicht parken. (dürfen)","answer":"darf"},{"prompt":"Wir ___ nicht früh aufstehen. (müssen, neg.)","answer":"müssen"}]},"praep-akk-wechsel":{"level":"A1","rule":["Two-way (Wechsel-)prepositions: an, auf, in, neben, über, unter, vor, hinter, zwischen. Dativ = WHERE (static), Akkusativ = WHERE TO (movement).","Question: Wo? (Dativ, static) vs Wohin? (Akk, movement).","Contractions: zum=zu+dem, zur=zu+der, am=an+dem, im=in+dem, ins=in+das, aufs=auf+das, beim=bei+dem.","Pure Akkusativ prepositions: durch, für, ohne, um, gegen."],"examples":["Ich bin in der Schule. (Dat, static) / Ich gehe in die Schule. (Akk, movement)","Das Bild hängt an der Wand. / Ich hänge das Bild an die Wand."],"drills":[{"prompt":"Ich gehe ___ Kino. (in→Akk contraction)","answer":"ins"},{"prompt":"Er ist ___ Schule. (in→Dat contraction)","answer":"in der / im"},{"prompt":"Wir fahren ___ Berlin. (nach)","answer":"nach"},{"prompt":"Ohne ___ Pass kann ich nicht fliegen. (der→Akk)","answer":"den"}]},"dativ":{"level":"A2","rule":["Dativ = indirect object (to/for whom). Articles: dem(m), der(f), dem(n), den(pl) — plural noun adds -n if not already ending in -n/-s.","Dativ verbs: geben, sagen, schreiben, helfen, danken, gehören, schmecken, gefallen, passen, wehtun, begegnen.","Two objects: give/say/write SOMETHING (Akk) TO SOMEONE (Dat): Ich gebe dem Mann (Dat) das Buch (Akk).","Dativ prepositions: aus, bei, mit, nach, seit, von, zu, gegenüber, ab, außer."],"examples":["Ich gebe der Frau das Buch.","Er hilft dem Kind.","Das Buch gehört mir. (mir=Dat of ich)"],"drills":[{"prompt":"Ich gebe ___ Mann das Buch. (der→Dat)","answer":"dem"},{"prompt":"Sie hilft ___ Kind. (das→Dat)","answer":"dem"},{"prompt":"Er schreibt ___ Freunden. (plural→Dat)","answer":"den"},{"prompt":"Ich komme ___ Berlin. (aus + Dat)","answer":"aus"},{"prompt":"Mit ___ Bruder gehe ich ins Kino. (mein→Dat m)","answer":"meinem"}]},"perfekt":{"level":"A2","rule":["Perfekt = spoken past. haben/sein (pos 2) + Partizip II (end of clause).","SEIN for: movement (gehen, fahren, kommen, fliegen, laufen), change of state (aufstehen, werden, sterben, einschlafen), and sein/bleiben/verschwinden. All others HABEN.","Partizip II: weak=ge+stem+t (gelernt, gemacht, gekauft); strong=ge+stem+en with vowel change (gegessen, gesprochen, gegangen); mixed (gebracht, gewusst, gebrannt). Separable: prefix+ge+stem (angekommen, aufgestanden). Inseparable (be-, ent-, er-, ver-, zer-, emp-) = NO ge- (verkauft, erklärt)."],"examples":["Ich habe Deutsch gelernt.","Wir sind nach Berlin gefahren.","Er hat ein Buch gekauft.","Sie hat es mir erklärt. (no ge-)"],"drills":[{"prompt":"Ich ___ Deutsch ___. (lernen)","answer":"habe, gelernt"},{"prompt":"Wir ___ nach Berlin ___. (fahren)","answer":"sind, gefahren"},{"prompt":"Sie ___ einen Kaffee ___. (trinken)","answer":"hat, getrunken"},{"prompt":"Er ___ um 7 Uhr ___. (aufstehen)","answer":"ist, aufgestanden"},{"prompt":"Der Lehrer ___ es uns ___. (erklären)","answer":"hat, erklärt"}]},"praeteritum-sein-haben":{"level":"A2","rule":["Präteritum = written/narrative past. In speech only sein/haben/modal verbs commonly use Präteritum (Perfekt for everything else).","sein: ich war, du warst, er war, wir waren, ihr wart, sie waren.","haben: ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten.","Modals Präteritum: konnte, musste, wollte, sollte, durfte, mochte — same endings as regular (ich/er same form)."],"examples":["Gestern war ich krank.","Ich hatte keine Zeit.","Er konnte nicht kommen."],"drills":[{"prompt":"Gestern ___ ich krank. (sein)","answer":"war"},{"prompt":"Wir ___ viel Hunger. (haben)","answer":"hatten"},{"prompt":"Du ___ schon fertig. (sein)","answer":"warst"},{"prompt":"Er ___ nicht kommen. (können, Prät.)","answer":"konnte"}]},"trennbare-verben":{"level":"A2","rule":["Separable verbs: prefix (an-, auf-, ein-, aus-, mit-, nach-, vor-, zu-) separates and goes to the END of the clause. Conjugated stem in position 2.","In Perfekt: ge- goes BETWEEN prefix and stem: anrufen→angerufen, aufstehen→aufgestanden.","With modal/infinitive: full infinitive at end, NOT separated: Ich will ihn anrufen.","Common: anrufen, aufstehen, ankommen, ausgehen, einkaufen, mitkommen, nachschauen, vorhaben, zumachen, anziehen, ausziehen, treffen (not separable!), fernsehen."],"examples":["Ich stehe um 7 Uhr auf.","Er ruft seine Mutter an.","Wir sind gestern ausgegangen.","Ich will heute Abend ausgehen."],"drills":[{"prompt":"Ich ___ um 7 Uhr ___. (aufstehen)","answer":"stehe, auf"},{"prompt":"Er ___ seine Mutter ___. (anrufen)","answer":"ruft, an"},{"prompt":"Der Zug ___ um 10 Uhr ___. (ankommen)","answer":"kommt, an"},{"prompt":"Wir wollen heute Abend ___. (ausgehen)","answer":"ausgehen"}]},"reflexiv":{"level":"A2","rule":["Reflexive verbs: subject acts on itself. Reflexive pronoun: mich/dich/sich/uns/euch/sich (Akk or Dat).","Akk reflexive (most common): sich freuen, sich interessieren, sich beeilen, sich erinnern an, sich freuen auf, sich setzen, sich anziehen, sich ausruhen.","Dat reflexive (when there's another object): sich (Dat) etwas ansehen/kaufen/merken/wünschen: Ich kaufe mir ein Buch.","sich + preposition: sich interessieren für, sich freuen auf/über, sich erinnern an, sich beschäftigen mit."],"examples":["Ich freue mich auf das Wochenende.","Er interessiert sich für Musik.","Sie kauft sich ein neues Kleid."],"drills":[{"prompt":"Ich ___ auf das Wochenende. (sich freuen)","answer":"freue mich"},{"prompt":"Er ___ für Fußball. (sich interessieren)","answer":"interessiert sich"},{"prompt":"Ihr ___ schon? (sich anziehen)","answer":"zieht euch an"},{"prompt":"Sie kauft ___ ein Buch. (Dat reflexive)","answer":"sich"}]},"komparation":{"level":"A2","rule":["Comparative: adjective + -er (schneller, größer). With umlaut: a/o/u often add umlaut (älter, größer, kürzer, stärker, jünger, näher).","Superlative: am + stem + -sten (am schnellsten, am größten). After d/t/s/ß/z add -est (am heißesten, am größten).","Irregular: gut→besser→am besten; viel→mehr→am meisten; gern→lieber→am liebsten; hoch→höher→am höchsten; nah→näher→am nächsten.","Comparisons: so…wie (equality), als (comparative): Er ist größer als ich. So groß wie ich."],"examples":["Mein Auto ist schneller als deins.","Sie ist die größte im Klassenzimmer.","Das ist am besten."],"drills":[{"prompt":"Er ist ___ als ich. (groß)","answer":"größer"},{"prompt":"Das ist ___ Buch. (gut, Superlativ)","answer":"das beste"},{"prompt":"Ich habe ___ Zeit als du. (viel)","answer":"mehr"},{"prompt":"Sie läuft ___ von allen. (schnell)","answer":"am schnellsten"}]},"adj-dekl-1":{"level":"A2","rule":["With definite article (der/die/das): endings = -e (Nom sg, Akk fem/neut) or -en (everything else). Rule: 'der-word shows the case → adjective ends in -e; otherwise -en.'","Nom: der gute Mann, die gute Frau, das gute Kind, die guten Kinder. Akk: den guten Mann, die gute Frau, das gute Kind, die guten Kinder.","With ein-words (ein, mein, dein, kein): same as definite IF the ein-word shows case/gender; only Nom masc & Akk neut (where ein has no ending) get -er/-es: ein guter Mann (Nom m), ein gutes Buch (Nom n), meinen guten Mann (Akk m)."],"examples":["Der alte Mann liest eine Zeitung.","Ich trinke einen heißen Kaffee.","Das kleine Kind schläft."],"drills":[{"prompt":"Der ___ Mann ist müde. (alt)","answer":"alte"},{"prompt":"Ich sehe einen ___ Mann. (alt, Akk m)","answer":"alten"},{"prompt":"Das ist ein ___ Buch. (neu, Nom n)","answer":"neues"},{"prompt":"Sie hat eine ___ Katze. (schwarz, Akk f)","answer":"schwarze"}]},"wechselprap-full":{"level":"A2","rule":["9 two-way prepositions: an, auf, in, neben, über, unter, vor, hinter, zwischen. Dativ=static (Wo?), Akkusativ=movement (Wohin?).","an: at/on (vertical surface). auf: on top of. in: inside. neben: next to. über: over/above. unter: under/below. vor: in front of / before. hinter: behind. zwischen: between.","Contractions: am=an+dem, ans=an+das, im=in+dem, ins=in+das, aufs=auf+das, übers=über+das, unters=unter+das, vors=vor+das, hinters=hinter+das."],"examples":["Das Bild hängt an der Wand. (Dat) — Ich hänge es an die Wand. (Akk)","Der Schlüssel liegt auf dem Tisch. — Ich lege ihn auf den Tisch."],"drills":[{"prompt":"Er sitzt ___ Tisch. (an + Dat m)","answer":"am"},{"prompt":"Ich gehe ___ Universität. (an + Akk f)","answer":"an die"},{"prompt":"Das Buch liegt ___ Tisch. (auf + Dat m)","answer":"auf dem"},{"prompt":"Sie hängt das Bild ___ Wand. (an + Akk f)","answer":"an die"}]},"genitiv-basics":{"level":"A2","rule":["Genitiv = possession ('s). Articles: des(m), der(f), des(n), der(pl). Masculine/neuter strong nouns add -(e)s: des Mannes, des Buches.","Genitiv prepositions: wegen (because of), während (during), trotz (despite), statt/instead of, außerhalb, innerhalb, diesseits, jenseits.","Possessive: das Auto des Mannes = the man's car. With names: Peters Auto (no apostrophe in German!).","Common Genitiv nouns: wegen des Wetters, während der Ferien, trotz der Kälte."],"examples":["Das ist das Auto meines Vaters.","Wegen des Regens bleiben wir zu Hause.","Während der Arbeit darf man nicht telefonieren."],"drills":[{"prompt":"Das Buch ___ Mannes ist neu. (der→Gen m)","answer":"des"},{"prompt":"___ des Regens gehe ich nicht raus. (because of)","answer":"Wegen"},{"prompt":"___ der Ferien reisen wir. (during)","answer":"Während"},{"prompt":"Das ist die Katze ___ Frau. (die→Gen f)","answer":"der"}]},"temp-praep":{"level":"A2","rule":["Time prepositions: an (days/dates: am Montag, am 1. Mai), in (months/seasons/years: im Mai, im Sommer, im Jahr 2026; longer periods: in einer Woche), um (clock time: um 8 Uhr).","vor (ago/before): vor einer Woche, vor dem Essen. nach (after): nach dem Essen, nach der Arbeit. seit (since, +Dat, present tense!): seit 2020, seit ich hier bin.","für (duration, future): für drei Tage. ab (from): ab morgen, ab dem 1. Januar. bis (until): bis Freitag."],"examples":["Am Montag arbeite ich.","Ich warte seit einer Stunde.","Nach dem Essen gehen wir spazieren."],"drills":[{"prompt":"___ Montag habe ich frei. (on)","answer":"Am"},{"prompt":"Ich lerne Deutsch ___ 2024. (since)","answer":"seit"},{"prompt":"___ dem Essen trinke ich Kaffee. (after)","answer":"Nach"},{"prompt":"Der Zug fährt ___ 8 Uhr ab. (at, clock)","answer":"um"}]},"futur-1":{"level":"A2","rule":["Futur I = future plans/predictions. werden (conjugated, pos 2) + infinitive (end).","werden: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden.","Often present tense is used for future with time words (morgen, nächste Woche). Futur I emphasizes intention/prediction.","Futur II (future perfect, rare): werden + Partizip II + haben/sein: Ich werde es gemacht haben."],"examples":["Ich werde nächstes Jahr nach Deutschland ziehen.","Es wird morgen regnen.","Wirst du mitkommen?"],"drills":[{"prompt":"Ich ___ Deutsch lernen. (werden)","answer":"werde"},{"prompt":"Es ___ morgen regnen. (werden, es)","answer":"wird"},{"prompt":"Wir ___ nach Berlin ___. (fahren)","answer":"werden, fahren"},{"prompt":"___ du mitkommen? (werden, du)","answer":"Wirst"}]},"nebensatz-1":{"level":"A2","rule":["Subordinate clause: conjugated verb goes to the VERY END. Connect with comma.","dass (that), weil (because), wenn (if/whenever, present/future; repeated past = als), ob (whether), als (when, single past event).","If subordinate clause comes FIRST, the main clause starts with the verb (position 1): Weil ich krank bin, bleibe ich zu Hause.","Word order inside: subject-objects-…-verb. Infinitive/Partizip at very end: Ich weiß, dass er kommen wird."],"examples":["Ich lerne Deutsch, weil ich nach Deutschland will.","Weil ich krank bin, bleibe ich zu Hause.","Ich weiß, dass du Deutsch lernst."],"drills":[{"prompt":"Ich bleibe zu Hause, ___ ich krank ___. (weil / sein)","answer":"weil, bin"},{"prompt":"___ ich Zeit habe, lese ich. (wenn)","answer":"Wenn"},{"prompt":"Er sagt, ___ er müde ___. (dass / sein)","answer":"dass, ist"},{"prompt":"___ ich Kind war, wohnte ich in Lagos. (als, single past)","answer":"Als"}]},"adj-dekl-2":{"level":"A2","rule":["Dativ with article: always -en: dem guten Mann, der guten Frau, dem guten Kind, den guten Kindern. (Plural Dativ noun also adds -n.)","Genitiv with article: always -en: des guten Mannes, der guten Frau, des guten Buches, der guten Kinder.","Dativ with ein-word: einem guten Mann, einer guten Frau, einem guten Kind, keinen guten Kindern.","Rule of thumb: after any article-like word that shows case, Dativ/Genitiv adjective = -en."],"examples":["Ich gebe dem guten Mann das Buch.","Das ist das Auto des alten Mannes.","Er hilft einer alten Frau."],"drills":[{"prompt":"Ich gebe dem ___ Mann das Buch. (alt, Dat m)","answer":"alten"},{"prompt":"Das Haus des ___ Mannes ist groß. (reich, Gen m)","answer":"reichen"},{"prompt":"Sie hilft einer ___ Frau. (alt, Dat f)","answer":"alten"},{"prompt":"Mit den ___ Kindern bin ich befreundet. (klein, Dat pl)","answer":"kleinen"}]},"konj2-basics":{"level":"A2","rule":["Konjunktiv II = hypothetical/unreal/polite. Core forms: wäre (sein), hätte (haben), würde + infinitive (all other verbs).","würde-construction: würde (pos 2) + infinitive (end). Most common in speech.","Polite requests: Könnten Sie…? / Würden Sie bitte…? / Hätten Sie bitte…? (softer than indicative).","Unreal conditional: Wenn ich Zeit hätte, würde ich reisen. (If I had time, I would travel.)"],"examples":["Ich würde gerne Deutsch lernen.","Wenn ich reich wäre, würde ich ein Haus kaufen.","Könnten Sie mir bitte helfen?"],"drills":[{"prompt":"Wenn ich Zeit ___, würde ich reisen. (haben)","answer":"hätte"},{"prompt":"Ich ___ gerne ein Haus kaufen. (würde)","answer":"würde"},{"prompt":"___ Sie mir bitte helfen? (können, polite)","answer":"Könnten"},{"prompt":"Wenn ich du ___, würde ich mehr lernen. (sein)","answer":"wäre"}]},"relativ-1":{"level":"A2","rule":["Relative pronoun = der/die/das matching gender/number of noun, but CASE of the relative clause. Comma before and after.","Forms: Nom der/die/das/die; Akk den/die/das/die; Dat dem/der/dem/den; Gen dessen/deren/dessen/deren.","Conjugated verb goes to the END of the relative clause.","Preposition before relative pronoun: der Mann, mit dem ich spreche (mit + Dat m)."],"examples":["Der Mann, der dort steht, ist mein Lehrer.","Das Buch, das ich lese, ist interessant.","Die Frau, der ich helfe, ist meine Nachbarin."],"drills":[{"prompt":"Der Mann, ___ dort steht, ist Lehrer. (m Nom)","answer":"der"},{"prompt":"Das Buch, ___ ich lese, ist neu. (n Akk)","answer":"das"},{"prompt":"Die Frau, ___ ich helfe, ist nett. (f Dat)","answer":"der"},{"prompt":"Der Zug, ___ ich fahre, ist spät. (mit + Dat m)","answer":"mit dem"}]},"infinitiv-zu":{"level":"A2","rule":["Infinitiv mit zu: zu + infinitive (zu gehen, zu lernen). With separable verb: zu goes between prefix and stem: aufzustehen, anzurufen.","um…zu = in order to (subject must be same): Ich lerne Deutsch, um in Deutschland zu arbeiten.","ohne…zu = without doing: Er ging, ohne sich zu verabschieden.","statt…zu / anstatt…zu = instead of: Statt zu lernen, spielt er Fußball.","Verbs taking zu-Infinitiv: versuchen zu, hoffen zu, planen zu, versprechen zu, lernen zu."],"examples":["Ich lerne Deutsch, um in Deutschland zu arbeiten.","Er geht, ohne sich zu verabschieden.","Ich versuche, jeden Tag zu lernen."],"drills":[{"prompt":"Ich lerne Deutsch, ___ in Deutschland zu arbeiten. (in order to)","answer":"um"},{"prompt":"Er ging, ohne sich zu ___. (verabschieden)","answer":"verabschieden"},{"prompt":"Ich versuche, jeden Tag Deutsch zu ___. (lernen)","answer":"lernen"},{"prompt":"Statt zu ___, spielt er. (lernen)","answer":"lernen"}]},"a2-consolidation":{"level":"A2","type":"practice","rule":["Review all A2 grammar: cases, Perfekt, modals, separable/reflexive, comparatives, subordinate clauses.","Do a 50-question gap-fill from your A2 textbook; log every mistake as a flashcard.","Practice 4 dialogues: at the doctor's, at the bank, on the phone, at the train station.","Write 150 words about a recent trip using Perfekt + temporal prepositions."],"examples":[],"drills":[]},"a2-mock":{"level":"A2","type":"practice","rule":["Timed Goethe A2 mock: reading (30 min), writing (30 min: email + note), listening (25 min).","Score yourself; every wrong answer → flashcard with the rule.","If <60%, repeat the weakest section tomorrow before moving to B1."],"examples":[],"drills":[]},"relativ-2":{"level":"B1","rule":["Dativ/Genitiv relative: dem/der/dem/den (Dat), dessen/deren/dessen/deren (Gen). Genitiv relative = whose: der Mann, dessen Auto ich kaufe.","wo/wohin/wo(r)+prep for places: die Stadt, wo ich wohne; das Haus, in dem ich wohne (more formal).","was refers to a whole clause/neuter indefinite: Das, was er sagt, stimmt. / Ich weiß nichts, was mich interessiert.","wer = whoever (Nom): Wer nicht arbeitet, soll nicht essen."],"examples":["Der Mann, dessen Auto gestohlen wurde, ruft die Polizei.","Die Stadt, wo ich wohne, ist groß.","Das, was du sagst, ist wahr."],"drills":[{"prompt":"Der Mann, ___ Auto ich kaufe, ist mein Onkel. (Gen m)","answer":"dessen"},{"prompt":"Die Frau, ___ Kinder ich unterrichte, ist Ärztin. (Gen f)","answer":"deren"},{"prompt":"Das ist alles, ___ ich weiß. (was)","answer":"was"},{"prompt":"Die Stadt, ___ ich wohne, liegt am Meer. (wo)","answer":"wo"}]},"nebensatz-2":{"level":"B1","rule":["obwohl (although), während (while/whereas), damit (so that — purpose, subject may differ), sodass (so that — result).","damit = in order that (different subject): Ich lerne, damit ich die Prüfung bestehe. (NOT um…zu when subjects differ!)","sodass = with the result that: Es regnete, sodass wir zu Hause blieben.","während can also mean whereas (contrast): Ich mag Kaffee, während sie Tee mag.","All take verb at end. If first, main clause verb-first."],"examples":["Obwohl er krank ist, geht er zur Arbeit.","Ich lerne, damit ich die Prüfung bestehe.","Er sprach laut, sodass ihn alle hörten."],"drills":[{"prompt":"___ er krank ist, geht er zur Arbeit. (although)","answer":"Obwohl"},{"prompt":"Ich arbeite, ___ ich Geld verdiene. (so that, purpose)","answer":"damit"},{"prompt":"Es war spät, ___ wir nach Hause gingen. (so that, result)","answer":"sodass"},{"prompt":"Ich lese gern, ___ mein Bruder lieber Fernsehen sieht. (whereas)","answer":"während"}]},"passiv-1":{"level":"B1","rule":["Vorgangspassiv (process): werden (pos 2) + Partizip II (end). Agent = von (person) / durch (thing/event).","Present: Das Haus wird gebaut. Perfekt: Das Haus ist gebaut worden. Präteritum: Das Haus wurde gebaut.","Akkusativ object of active becomes passive subject (Nom). Dativ object stays Dativ (subjectless passive possible: Dem Mann wird geholfen).","No passive for: sein/haben, reflexive, intransitive with sein (gehen, kommen), modal verbs (use Infinitiv + werden: Das muss gemacht werden)."],"examples":["Aktiv: Man baut das Haus. → Passiv: Das Haus wird gebaut.","Der Brief wurde von ihm geschrieben.","Dem Mann wird geholfen."],"drills":[{"prompt":"Das Haus ___ gebaut. (present)","answer":"wird"},{"prompt":"Der Brief ___ von ihm geschrieben. (Prät.)","answer":"wurde"},{"prompt":"Das Buch ___ gelesen ___. (Perfekt)","answer":"ist, worden"},{"prompt":"Aktiv: Man hilft ihm. → Passiv: ___ wird geholfen. (Dat stays)","answer":"Ihm"}]},"passiv-2":{"level":"B1","rule":["Passive with modals: modal + Partizip II + werden: Das muss gemacht werden. Das kann gemacht werden.","Zustandspassiv (state passive): sein + Partizip II (resulting state, no process): Das Fenster ist offen (geöffnet). Das Haus ist gebaut.","Vorgangspassiv = action (werden), Zustandspassiv = resulting state (sein).","Passive substitutes: man (active), sich lassen (can be done: Das lässt sich machen), bekommen/erhalten + Partizip: Er bekommt das Buch geschickt."],"examples":["Die Arbeit muss bis Freitag erledigt werden.","Das Fenster ist geöffnet. (state)","Das Problem lässt sich lösen."],"drills":[{"prompt":"Das ___ sofort gemacht ___. (müssen)","answer":"muss, werden"},{"prompt":"Die Tür ist ___. (schließen, Zustandspassiv)","answer":"geschlossen"},{"prompt":"Das ___ sich reparieren. (lassen)","answer":"lässt"},{"prompt":"Er ___ das Buch geschickt. (bekommen)","answer":"bekommt"}]},"konj2-wuerde":{"level":"B1","rule":["Full KII: strong verbs form KII with umlaut + -te: gehen→ginge, sprechen→spräche, essen→äße, fahren→führe, kommen→käme, wissen→wüsste.","In practice: würde + infinitive replaces most strong KII forms (except sein/haben/modal which are short and common).","KII of modals: könnte, müsste, wollte, sollte, dürfte, möchte — used for polite/possibility.","Unreal conditional present: Wenn + KII (Präteritum-form), würde + Inf: Wenn ich Zeit hätte, würde ich kommen."],"examples":["Wenn ich reich wäre, würde ich ein Haus kaufen.","Er könnte kommen, wenn er Zeit hätte.","Ich wüsste eine Lösung."],"drills":[{"prompt":"Wenn ich ___ , würde ich kommen. (Zeit haben)","answer":"Zeit hätte"},{"prompt":"Er ___ Deutsch sprechen, wenn er übte. (können)","answer":"könnte"},{"prompt":"Ich ___ es dir sagen, wenn ich wüsste. (werden)","answer":"würde"},{"prompt":"Wenn ich du ___, würde ich mehr lernen. (sein)","answer":"wäre"}]},"indirekte-rede":{"level":"B1","rule":["Indirect speech = report what someone said, using Konjunktiv I (formal) or KII (colloquial/doubt).","KI forms: er sei, er habe, er werde, er gehe, er lerne (regular: stem + -e). For most verbs KI = same as present except sein/haben/werden/modals, so KII is used to distinguish.","Structure: Er sagt, dass er krank sei. / Er fragt, ob ich komme. / Er fragt, wann ich komme.","Yes/no question → ob. W-question → keep question word. Statement → dass."],"examples":["Er sagt: 'Ich bin krank.' → Er sagt, dass er krank sei.","Sie fragt: 'Kommst du?' → Sie fragt, ob ich komme.","Er fragt: 'Wann kommst du?' → Er fragt, wann ich komme."],"drills":[{"prompt":"Er sagt: 'Ich habe Hunger.' → Er sagt, dass er Hunger ___. (haben KI)","answer":"habe"},{"prompt":"Sie fragt: 'Bist du müde?' → Sie fragt, ob ich müde ___. (sein KI)","answer":"sei"},{"prompt":"Er fragt: 'Wo wohnst du?' → Er fragt, wo ich ___. (wohnen)","answer":"wohne"}]},"nomen-praep":{"level":"B1","rule":["Noun + fixed preposition: die Angst vor, die Liebe zu, der Hass auf, das Interesse an, die Freude über/auf, die Wut auf, das Gespräch mit, die Meinung über, die Frage nach, die Suche nach, die Antwort auf, die Lösung für, die Angst vor.","Verb + preposition + noun often parallels noun + preposition: sich interessieren für → das Interesse an; warten auf → das Warten auf.","Always learn noun WITH its preposition AND case: die Angst vor (+Dat), die Suche nach (+Dat), die Antwort auf (+Akk)."],"examples":["Ich habe Angst vor Spinnen.","Er hat Interesse an Politik.","Die Antwort auf die Frage ist einfach."],"drills":[{"prompt":"Ich habe Angst ___ Spinnen. (vor)","answer":"vor"},{"prompt":"Er hat Interesse ___ Politik. (an + Dat)","answer":"an"},{"prompt":"Die Antwort ___ die Frage ist 42. (auf + Akk)","answer":"auf"},{"prompt":"Ich warte ___ den Zug. (auf + Akk)","answer":"auf"}]},"adj-dekl-3":{"level":"B1","rule":["Zero article (no article / plural with no article / after viel/wenig/einige/mehrere): adjective takes the der-ending (strong declension).","Strong endings: Nom m=er, f=e, n=es, pl=e. Akk m=en, f=e, n=es, pl=e. Dat m=em, f=er, n=em, pl=en. Gen m=en, f=er, n=en, pl=er.","After viel/wenig (singular, uncountable): gute Milch, gutes Bier. After einige/mehrere/viele (plural): einige gute Freunde (plural endings).","After possessive/kein in plural: keine guten Bücher (weak -en because kein shows plural)."],"examples":["Guter Wein ist teuer.","Ich trinke kalte Milch.","Er kauft sich neue Schuhe.","Mit kaltem Wasser waschen."],"drills":[{"prompt":"___ Wein ist teuer. (gut, Nom m, no art.)","answer":"Guter"},{"prompt":"Ich trinke ___ Milch. (kalt, Akk f, no art.)","answer":"kalte"},{"prompt":"Mit ___ Wasser wasche ich mich. (kalt, Dat n)","answer":"kaltem"},{"prompt":"Er liest ___ Bücher. (neu, Akk pl, no art.)","answer":"neue"}]},"partizip-adj":{"level":"B1","rule":["Partizip I (verb + -d: laufend, singend) as adjective = active, simultaneous: der laufende Hund = the running dog.","Partizip II (gegessen, gelernt) as adjective = passive, completed: das verlorene Buch = the lost book. Only transitive verbs!","Decline like any adjective: der laufende Hund, ein singendes Kind, die geöffnete Tür.","Extended participle phrase before noun: ein von allen bewunderter Mann (a man admired by all) — typical formal/B2 style."],"examples":["Der laufende Hund ist schnell.","Das verlorene Buch wurde gefunden.","Ein schnell fahrendes Auto ist gefährlich."],"drills":[{"prompt":"Der ___ Hund bellt. (laufen, P I)","answer":"laufende"},{"prompt":"Das ___ Buch ist weg. (verlieren, P II)","answer":"verlorene"},{"prompt":"Ein ___ Kind lacht. (singen, P I, Nom n)","answer":"singendes"},{"prompt":"Die ___ Tür ist kaputt. (öffnen, P II)","answer":"geöffnete"}]},"tekamolo":{"level":"B1","rule":["Adverb order in middle field: Te(mporal) – Ka(usal) – Mo(dal) – Lo(kal): time → cause → manner → place.","Example: Ich fahre morgen (time) wegen der Arbeit (cause) gern (manner) nach Berlin (place).","Pronouns before nouns: Ich gebe es ihm. / Ich gebe dem Mann das Buch. (pronouns come first: ich gebe es dem Mann.)","Nicht: negates the element right after it; at end negates whole verb: Ich lerne nicht Deutsch. (not German, maybe French) / Ich lerne Deutsch nicht. (I don't learn it)."],"examples":["Ich bin heute wegen des Wetters leider zu Hause geblieben.","Er hat es mir gestern gegeben."],"drills":[{"prompt":"Ich fahre ___ ___ ___ ___. (morgen / nach Berlin / wegen der Arbeit / gern) in order","answer":"morgen wegen der Arbeit gern nach Berlin"},{"prompt":"Ich gebe ___ ___. (es / dem Mann) order","answer":"es dem Mann"}]},"verb-praep-full":{"level":"B1","rule":["Verb + fixed preposition (learn as one unit!): warten auf (Akk), sich freuen auf/über, sich interessieren für, denken an (Akk), träumen von, bestehen aus, teilnehmen an (Dat), sich erinnern an, sich beschäftigen mit, sich freuen auf, hoffen auf, sich vorbereiten auf, sich bedanken für, sich entschuldigen für, sich ärgern über, sich freuen über.","Akkusativ: auf, für, über, an (when sich erinnern an). Dativ: von, mit, an (teilnehmen an), nach, zu.","If followed by verb: use zu + Inf or nominalization: Ich warte darauf, zu gehen. (da- + preposition: darauf, dafür, dabei…)"],"examples":["Ich warte auf den Zug.","Er besteht aus zwei Teilen.","Ich erinnere mich an dich.","Ich freue mich darauf, dich zu sehen."],"drills":[{"prompt":"Ich warte ___ den Bus. (auf)","answer":"auf"},{"prompt":"Er besteht ___ zwei Teilen. (aus + Dat)","answer":"aus"},{"prompt":"Ich erinnere mich ___ meine Kindheit. (an + Akk)","answer":"an"},{"prompt":"Ich freue mich ___, dich zu sehen. (darauf)","answer":"darauf"}]},"b1-vocab-themes":{"level":"B1","type":"practice","rule":["Learn 45 words today across: education (Ausbildung, Studium, Berufsschule), work (Arbeitsvertrag, Gehalt, Urlaub), environment (Umwelt, Müll, erneuerbare Energien), health (Gesundheit, Arzt, Krankenversicherung).","Write each new word in an original sentence; add all to SM-2.","Use 10 of them in a paragraph about your Ausbildung."],"examples":[],"drills":[]},"b1-mock-1":{"level":"B1","type":"practice","rule":["Timed Goethe B1 mock: reading (65 min), writing (60 min: email + forum post), listening (30 min).","Score; every mistake → flashcard. Writing: self-grade against B1 rubric (structure, vocabulary, grammar)."],"examples":[],"drills":[]},"konj2-past":{"level":"B1","rule":["KII past (unreal past): hätte/wäre + Partizip II. = would have done / had done (but didn't).","Wenn ich mehr gelernt hätte, hätte ich die Prüfung bestanden. (If I had studied more, I would have passed.)","With movement verbs: wäre + Partizip II: Wenn ich früher gekommen wäre, hätte ich den Zug erwischt.","Regret: Ich hätte mehr lernen sollen. (I should have studied more.) / Ich wünschte, ich wäre nicht gegangen."],"examples":["Wenn ich mehr gelernt hätte, hätte ich bestanden.","Ich wäre gern mitgekommen, aber ich hatte keine Zeit.","Er hätte es wissen müssen."],"drills":[{"prompt":"Wenn ich mehr gelernt ___, hätte ich bestanden. (haben)","answer":"hätte"},{"prompt":"Ich ___ gern mitgekommen. (sein)","answer":"wäre"},{"prompt":"Ich ___ mehr lernen sollen. (haben)","answer":"hätte"},{"prompt":"Wenn er nicht so schnell ___ wäre, wäre es nicht passiert. (fahren)","answer":"gefahren"}]},"conditionals":{"level":"B1","rule":["Conditional I (real possible): Wenn + present, future/present: Wenn ich Zeit habe, komme ich. (I may come)","Conditional II (unreal present): Wenn + KII (Prät form), würde + Inf: Wenn ich Zeit hätte, würde ich kommen. (but I don't)","Conditional III (unreal past): Wenn + hätte/wäre + PII, hätte/wäre + PII: Wenn ich Zeit gehabt hätte, wäre ich gekommen. (but I didn't)","Omitting wenn: Hätte ich Zeit, würde ich kommen. (inversion, formal)."],"examples":["Wenn ich Zeit habe, komme ich. (real)","Wenn ich Zeit hätte, würde ich kommen. (unreal present)","Wenn ich Zeit gehabt hätte, wäre ich gekommen. (unreal past)"],"drills":[{"prompt":"Wenn ich Zeit ___, komme ich. (real present, haben)","answer":"habe"},{"prompt":"Wenn ich reich ___, würde ich reisen. (unreal present, sein)","answer":"wäre"},{"prompt":"Wenn ich es gewusst ___, hätte ich es dir gesagt. (unreal past, haben)","answer":"hätte"}]},"genitiv-full":{"level":"B1","rule":["Genitiv articles: des(m), der(f), des(n), der(pl). Strong masc/neut nouns add -(e)s: des Mannes, des Kindes, des Hauses.","Weak masculine nouns (n-declension): add -(e)n in all cases except Nom: der Student → des Studenten, dem Studenten, den Studenten. Common: Herr, Name, Student, Mensch, Nachbar, Kollege, Prinz, Held.","Genitiv prepositions: wegen, während, trotz, statt, außerhalb, innerhalb, angesichts, mithilfe, anhand, aufgrund.","Genitiv vs wegen+dativ (colloquial): standard = wegen des Regens (Gen); colloquial = wegen dem Regen (Dat). Use Genitiv in writing."],"examples":["Das Auto des Studenten ist rot.","Wegen des schlechten Wetters fahren wir nicht.","Innerhalb eines Monats habe ich es gelernt."],"drills":[{"prompt":"Das Auto ___ Studenten ist rot. (der→Gen, weak n)","answer":"des"},{"prompt":"___ des Wetters bleiben wir zu Hause. (because of)","answer":"Wegen"},{"prompt":"Ich helfe ___ Studenten. (Dat, weak n)","answer":"dem"},{"prompt":"___ eines Jahres spreche ich Deutsch. (within)","answer":"Innerhalb"}]},"rhetorik-1":{"level":"B1","rule":["je…desto/umso: the more…the more. Je + comparative, desto + comparative: Je mehr ich lerne, desto besser werde ich.","nicht nur…sondern auch: not only…but also. If first clause inverted: Nicht nur lerne ich Deutsch, sondern auch Französisch.","sowohl…als auch: both…and. weder…noch: neither…nor. mal…mal: sometimes…sometimes.","In B2 essays these boost your score — use 2-3 per essay."],"examples":["Je mehr ich lerne, desto besser werde ich.","Er spricht nicht nur Deutsch, sondern auch Englisch.","Je schneller, desto besser."],"drills":[{"prompt":"___ mehr ich übe, ___ besser spreche ich. (je/desto)","answer":"Je, desto"},{"prompt":"Er spricht ___ Deutsch ___ auch Englisch. (not only)","answer":"nicht nur, sondern"},{"prompt":"Ich habe ___ Zeit ___ Geld. (neither/nor)","answer":"weder, noch"}]},"b1-listening":{"level":"B1","type":"practice","rule":["Listen to a 3-minute DW Top-Thema audio twice. First time: gist. Second time: take notes (who, what, where, why, numbers).","Write a 10-bullet summary in German. Check against transcript. Unknown words → flashcards.","Shadow-read 1 minute of the transcript aloud mimicking intonation."],"examples":[],"drills":[]},"b1-formal-email":{"level":"B1","rule":["Formal email structure: Betreff (subject), Anrede (Sehr geehrte Frau Müller, / Sehr geehrter Herr Schmidt,), body, Grußformel (Mit freundlichen Grüßen, + Name).","Formal = Sie-form, no contractions. Opening phrases: Ich schreibe Ihnen, weil… / Ich möchte mich nach… erkundigen. / Hiermit beantrage ich…","Closing: Ich würde mich freuen, von Ihnen zu hören. / Für Rückfragen stehe ich Ihnen gerne zur Verfügung.","Informal (friends): Lieber… / Liebe…, Gruß: Viele Grüße, Liebe Grüße, Tschüss, du-form."],"examples":["Betreff: Bewerbung um eine Ausbildungsstelle","Sehr geehrte Frau Müller, ich bewerbe mich hiermit um…","Mit freundlichen Grüßen, (Ihr Name)"],"drills":[{"prompt":"Formal to a woman: ___ Frau Müller,","answer":"Sehr geehrte"},{"prompt":"Formal closing: ___ Grüßen,","answer":"Mit freundlichen"},{"prompt":"Subject line for a complaint: ___: defekte Ware","answer":"Beschwerde / Reklamation"}]},"b1-authentic":{"level":"B1","type":"practice","rule":["Read a real Tagesschau in Einfacher Sprache article. Underline: main claim, 3 supporting facts, unknown words (→ flashcards).","Write a 200-word summary + your opinion. Use 3 connectors (obwohl, deshalb, außerdem).","Find 5 examples of passive or KII — circle them."],"examples":[],"drills":[]},"debate-1":{"level":"B1","rule":["Opinion phrases: Meiner Meinung nach… / Ich bin der Meinung, dass… / Ich denke, dass… / Aus meiner Sicht…","Pros/cons: Einerseits…, andererseits… / Dafür spricht…, Dagegen spricht… / Ein Vorteil ist…, Ein Nachteil ist…","Conclusion: Zusammenfassend… / Abschließend… / Ich bin überzeugt, dass… / Letztendlich…","Structure: Einleitung (topic + your opinion) → Pro argumente → Contra argumente → Fazit (your final view)."],"examples":["Meiner Meinung nach sollte man mehr Fahrrad fahren.","Einerseits ist es gesund, andererseits ist es gefährlich.","Zusammenfassend bin ich der Meinung, dass…"],"drills":[{"prompt":"___ Meinung nach ist das falsch. (my)","answer":"Meiner"},{"prompt":"Einerseits ist es billig, ___ ist es schlecht. (on the other hand)","answer":"andererseits"},{"prompt":"___ bin ich der Meinung, dass… (in conclusion)","answer":"Zusammenfassend / Abschließend"}]},"b1-gapfill":{"level":"B1","type":"practice","rule":["50-question gap-fill covering all B1 grammar. Time: 40 min.","For every mistake: identify the rule, write it on a flashcard, add to SM-2 with 'Again' rating.","Rewrite 5 of your wrong sentences correctly aloud."],"examples":[],"drills":[]},"b1-vocab-sprint":{"level":"B1","type":"practice","rule":["Learn 100 high-frequency B1 words today (reduced example sentences). Add all to SM-2.","Write one story (200 words) using 20 of them. This forces active recall.","Quiz yourself: cover English, recall German. Any miss → 'Again' rating."],"examples":[],"drills":[]},"b1-listening-2":{"level":"B1","type":"practice","rule":["Easy German street interview: watch once without subtitles (gist), once with German subtitles (transcribe 1 minute).","Note 10 colloquial phrases (e.g., 'Auf jeden Fall!', 'Naja, also…'). Add to flashcards.","Imitate 30 seconds of speech (shadowing) — record yourself, compare."],"examples":[],"drills":[]},"b1-speaking":{"level":"B1","type":"practice","rule":["Bildbeschreibung (photo description) structure: Was sehe ich? (Vordergrund/Hintergrund) → Was passiert? → Meine Meinung dazu.","Prepare 3 monologues (3 min each): Mein Hobby, Mein Traumjob, Meine Stadt. Use your 2h group to deliver + get feedback.","Use: Man sieht…, Im Vordergrund…, Im Hintergrund…, Das könnte… sein. Ich denke, dass…"],"examples":[],"drills":[]},"b1-mock-2":{"level":"B1","type":"practice","rule":["Full Goethe B1 mock exam, timed, all sections. Speaking: use your group as examiners.","Score; compare with mock #1. List top 3 gaps → they become Month 3 Week 1 focus."],"examples":[],"drills":[]},"passiv-b2":{"level":"B2","rule":["All tenses passive: present (wird gemacht), Präteritum (wurde gemacht), Perfekt (ist gemacht worden), Futur (wird gemacht werden), with modal (muss gemacht werden).","Substitutes (B2 style, avoid overusing passive): man-Satz, sich lassen (Das lässt sich nicht leugnen), bekommen/erhalten-passiv (Er bekommt das Geld überwiesen), sein + zu-Inf (Das ist zu machen = must be done), es gibt + zu (Es gibt viel zu tun).","Impersonal passive: with intransitive verbs + modal: Hier wird nicht geraucht. (No smoking here.) Subject 'es' optional: Es wird hier gearbeitet.","Vorgangspassiv vs Zustandspassiv: Die Tür wurde geöffnet (action) vs Die Tür ist geöffnet (state)."],"examples":["Das muss sofort erledigt werden.","Das Problem lässt sich lösen.","Hier wird nicht geraucht.","Es ist viel zu tun."],"drills":[{"prompt":"Das ___ nicht geleugnet ___. (sich lassen)","answer":"lässt, werden"},{"prompt":"Hier ___ nicht geraucht. (impersonal passive)","answer":"wird"},{"prompt":"Er ___ das Geld überwiesen. (bekommen-passiv)","answer":"bekommt"},{"prompt":"Die Arbeit ___ bis morgen erledigt ___. (müssen)","answer":"muss, werden"}]},"konj2-b2":{"level":"B2","rule":["KII for indirect speech when KI is identical to indicative (most verbs): Er sagte, er wäre krank / er habe keine Zeit / er würde kommen.","Polite formal: Könnten Sie…? / Dürfte ich…? / Ich hätte gern… / Ich würde vorschlagen, dass…","Unreal comparison: Er tut so, als ob er alles wüsste. (as if) — als ob + KII, verb at end.","Wish: Ich wünschte, ich könnte Deutsch. / Wenn ich doch nur mehr Zeit hätte! (wish + doch/nur + KII)."],"examples":["Er sagte, er würde kommen.","Er tut so, als ob er reich wäre.","Ich hätte gern ein Bier, bitte.","Wenn ich doch nur mehr Zeit hätte!"],"drills":[{"prompt":"Er tut so, ___ ob er alles wüsste. (as if)","answer":"als"},{"prompt":"___ ich gern ein Kaffee. (haben, polite)","answer":"Ich hätte"},{"prompt":"Wenn ich ___ nur mehr Zeit hätte! (emphasis particle)","answer":"doch"},{"prompt":"Er sagte, er ___ krank. (sein, indirect)","answer":"wäre"}]},"connectors-b2":{"level":"B2","rule":["Conjunctions (verb to end): obwohl, während, sodass, damit, indem, sodass, falls, sofern, seitdem, sobald, solange.","Adverbial connectors (verb position 2!): trotzdem, dennoch, folglich, demzufolge, außerdem, darüber hinaus, hingegen, dagegen, folglich, infolgedessen, andererseits, letztendlich, demnach.","Key: after a period/comma + adverbial connector, the VERB comes first: Es regnete. Trotzdem ging er raus. / Es regnete; trotzdem ging er raus.","B2 essay must-haves: einerseits/andererseits, darüber hinaus, folglich, dennoch, hingegen, infolgedessen, letztendlich."],"examples":["Es regnete. Trotzdem ging er spazieren.","Er lernte viel; folglich bestand er die Prüfung.","Ich mag Kaffee. Mein Bruder hingegen trinkt nur Tee."],"drills":[{"prompt":"Es regnete. ___ ging er raus. (nevertheless, adv connector → verb 2nd)","answer":"Trotzdem"},{"prompt":"Er lernte viel; ___ bestand er. (consequently)","answer":"folglich / infolgedessen"},{"prompt":"Ich mag Kaffee. Mein Bruder ___ trinkt Tee. (whereas, adv)","answer":"hingegen"},{"prompt":"___ es regnet, bleiben wir zu Hause. (if, conjunction)","answer":"Falls"}]},"nvv-1":{"level":"B2","rule":["Nomen-Verb-Verbindungen (functional verb constructions): noun + light verb with idiomatic meaning. Learn as units.","Common: Maßnahmen ergreifen (take measures), Einfluss nehmen auf (influence), Verantwortung übernehmen (take responsibility), zur Verfügung stehen (be available), in Anspruch nehmen (use/avail oneself), zum Ausdruck bringen (express), in Betracht ziehen (consider), zur Kenntnis nehmen (note), Anwendung finden (be applied), Beziehung herstellen (establish contact).","They make your writing formal/B2. Replace simple verbs: beeinflussen → Einfluss nehmen auf; nutzen → in Anspruch nehmen.","Each has a fixed case for the noun: Einfluss nehmen auf (+Akk), Verantwortung übernehmen (Akk), zur Verfügung stehen (Dat)."],"examples":["Die Regierung ergreift Maßnahmen gegen die Krise.","Das Buch hat großen Einfluss auf mich genommen.","Stehen Ihnen Fragen zur Verfügung?"],"drills":[{"prompt":"Die Regierung ___ Maßnahmen. (ergreifen)","answer":"ergrifft / ergreift"},{"prompt":"Er ___ Einfluss auf die Entscheidung. (nehmen)","answer":"nimmt"},{"prompt":"Ich werde es in Betracht ___. (ziehen)","answer":"ziehen"},{"prompt":"Für Rückfragen stehe ich Ihnen zur ___. (Verfügung)","answer":"Verfügung"}]},"nominalstil":{"level":"B2","rule":["Nominalstil (noun style) = replace verbs with nouns (formal/B2 academic writing): Ich untersuche → meine Untersuchung von…; weil die Stadt wächst → aufgrund des Wachstums der Stadt.","Typical: verb→noun (untersuchen→die Untersuchung, diskutieren→die Diskussion, entscheiden→die Entscheidung) + preposition: bei der Untersuchung, durch die Analyse, trotz der Zunahme.","zu + nominalized infinitive: zum Ausdruck bringen, zur Kenntnis nehmen, in Betracht ziehen.","Don't overdo it — 2-3 per essay is enough. Nominalstil makes writing dense and formal."],"examples":["Bei der Untersuchung stellte man fest, dass… (vs: Als man untersuchte…)","Durch die Zunahme der Bevölkerung… (vs: Weil die Bevölkerung zunimmt…)"],"drills":[{"prompt":"Weil die Stadt wächst → ___ des Wachstums der Stadt (due to)","answer":"Aufgrund / Durch"},{"prompt":"entscheiden → die ___ (noun)","answer":"Entscheidung"},{"prompt":"diskutieren → die ___ (noun)","answer":"Diskussion"}]},"wortbildung":{"level":"B2","rule":["Prefixes (inseparable, no ge- in PII): be- (makes intransitive transitive: fahren→befahren, antworten→beantworten), ent- (remove: decken→entdecken), er- (achieve: lernen→erlernen, finden→erfinden), ver- (change/wrong: kaufen→verkaufen, laufen→verlaufen), zer- (break into pieces: brechen→zerbrechen).","Suffixes: -ung (verb→fem noun: die Meinung, die Lösung), -heit/-keit (adj→fem noun: die Freiheit, die Möglichkeit), -er/-ler/-in (person: der Lehrer, die Verkäuferin), -lich (adj: freundlich, möglich), -isch (adj: typisch, spanisch), -bar (adj: machbar, essbar = -able).","Compound nouns: last word determines gender/article: das + Auto = das Auto; der + Zug = der Zug. Plural of last word.","Learning word families multiplies your vocab: lernen → der Lerner, die Lernt, erlernen, verlernen, lernbar, gelernnt."],"examples":["entdecken = to discover (decken=cover, ent-=remove)","möglich → die Möglichkeit","der Bahnhof + die Uhr = die Bahnhofsuhr (fem)"],"drills":[{"prompt":"möglich → die ___ (noun)","answer":"Möglichkeit"},{"prompt":"decken (cover) + ___ = entdecken (discover)","answer":"ent-"},{"prompt":"kaufen + ver- = ___ (sell)","answer":"verkaufen"},{"prompt":"machbar = ___ (English meaning)","answer":"doable / possible"}]},"relativ-b2":{"level":"B2","rule":["Prepositional relative: preposition + pronoun: der Mann, mit dem ich rede; die Frage, über die wir sprechen; das Problem, mit dem wir kämpfen.","was (after neuter singular / alles/nichts/vieles / whole clause): Das, was er sagte, war falsch. / Ich weiß nichts, was dich interessiert. / Er kam zu spät, was mich ärgerte.","wo(r)+preposition (for things, not people): das Buch, woran ich denke; die Sache, worüber wir sprechen. For people: der Mann, an den ich denke.","wer/was/wem (whoever): Wer zuletzt lacht, lacht am besten. / Wem das nicht passt, kann gehen."],"examples":["Der Mann, mit dem ich arbeite, ist sehr nett.","Das, was du sagst, stimmt nicht.","Er kam zu spät, was mich ärgerte."],"drills":[{"prompt":"Der Mann, ___ ich arbeite, ist nett. (with + Dat m)","answer":"mit dem"},{"prompt":"Das, ___ du sagst, ist wahr. (neuter relative)","answer":"was"},{"prompt":"Er kam spät, ___ mich ärgerte. (whole clause)","answer":"was"},{"prompt":"___ zuerst kommt, mahlt zuerst. (whoever)","answer":"Wer"}]},"konzessiv":{"level":"B2","rule":["Concessive (despite): obwohl (conj, verb end), trotzdem/dennoch (adv, verb pos 2), trotz (+Gen), ungeachtet (+Gen), auch wenn (even if), selbst wenn, bei aller… (with all…).","Position: Obwohl es regnet, gehe ich raus. / Es regnet. Trotzdem gehe ich raus. / Trotz des Regens gehe ich raus.","B2 nuance: ungeachtet = regardless of (formal); bei aller Bemühung = despite all effort; mag sein, aber… (maybe, but…).","Use concessive to show contrast in essays — scores points for complexity."],"examples":["Obwohl er viel lernte, fiel er durch.","Er lernte viel. Trotzdem fiel er durch.","Trotz des Regens gingen wir spazieren."],"drills":[{"prompt":"___ des Regens gehen wir raus. (despite + Gen)","answer":"Trotz"},{"prompt":"Es regnet. ___ gehen wir raus. (nevertheless, adv)","answer":"Trotzdem / Dennoch"},{"prompt":"___ er viel lernte, fiel er durch. (although, conj)","answer":"Obwohl"},{"prompt":"___ aller Bemühungen gelang es nicht. (with all, formal)","answer":"Bei"}]},"tempus-narration":{"level":"B2","rule":["In narrative writing (stories, reports): use Präteritum for main past events (not Perfekt — that's spoken).","Perfekt in writing = completed action with present relevance, or in spoken report. Präteritum = narrative past.","Plusquamperfekt (had done): war/hatte + PII — action BEFORE another past action: Nachdem ich gegessen hatte, ging ich. (after I had eaten, I left)","Sequence: earlier action = Plusquamperfekt, later = Präteritum. Signal: nachdem, als, bevor."],"examples":["Gestern ging ich ins Kino. (Prät, narrative)","Nachdem ich gegessen hatte, ging ich ins Kino. (Pqp then Prät)","Er war schon gegangen, als ich ankam."],"drills":[{"prompt":"Gestern ___ ich ins Kino. (gehen, Prät narrative)","answer":"ging"},{"prompt":"Nachdem ich gegessen ___, ging ich. (haben, Plusquamperfekt)","answer":"hatte"},{"prompt":"Er ___ schon gegangen, als ich ankam. (sein, Pqp)","answer":"war"}]},"kollok-adj":{"level":"B2","rule":["Adjective+noun collocations (learn as units!): hohe Priorität, starkes Interesse, großer Wert auf… legen, enge Beziehung, tiefe Traurigkeit, schwerer Fehler, großer Erfolg, klare Meinung, hohe Nachfrage, geringes Angebot, erheblicher Unterschied, bedeutende Rolle.","Verb+noun: eine Frage stellen, eine Entscheidung treffen, ein Versprechen halten/brechen, Angst haben, Erfolg haben, Verantwortung übernehmen, Maßnahmen ergreifen.","Adverb+verb: stark betonen, deutlich machen, weit verbreitet, zutiefst überzeugt, voll und ganz zustimmen.","Using correct collocations = B2. Wrong collocation (e.g. 'machen einen Fehler' instead of 'Fehler machen') marks you as B1."],"examples":["Das hat hohe Priorität.","Ich lege großen Wert auf Pünktlichkeit.","Er hat einen schweren Fehler gemacht."],"drills":[{"prompt":"Das hat ___ Priorität. (high)","answer":"hohe"},{"prompt":"Ich lege großen ___ auf Pünktlichkeit. (Wert)","answer":"Wert"},{"prompt":"einen Fehler ___ (machen)","answer":"machen"},{"prompt":"eine Entscheidung ___ (treffen)","answer":"treffen"}]},"redewendungen":{"level":"B2","rule":["Common idioms (50 to learn): ins Schwarze treffen (hit the nail on the head), den Nagel auf den Kopf treffen, die Kirche im Dorf lassen (don't exaggerate), Tomaten auf den Augen haben (not see the obvious), Schwein haben (be lucky), die Hände in den Schoß legen (do nothing), auf dem Schlauch stehen (be slow to understand), einen Bärenhunger haben (be starving), die Daumen drücken (keep fingers crossed), ins Gras beißen (kick the bucket), das ist nicht mein Bier (not my problem), das ist mir Wurst (I don't care), einen Kater haben (hangover), blau machen (skip work/school), das Handtuch werfen (give up).","Use sparingly in writing (1-2 per essay), more in speaking. They make you sound natural.","Learn with the full phrase + context, not word-by-word."],"examples":["Du triffst den Nagel auf den Kopf!","Ich drücke dir die Daumen!","Er hat einfach das Handtuch geworfen."],"drills":[{"prompt":"Viel Glück! Ich drücke dir die ___. (fingers crossed)","answer":"Daumen"},{"prompt":"Er hat nach 2 Stunden das Handtuch ___. (give up)","answer":"geworfen"},{"prompt":"Du triffst den Nagel auf den ___. (hit the nail)","answer":"Kopf"},{"prompt":"Das ist nicht mein ___. (not my problem)","answer":"Bier"}]},"b2-authentic-reading":{"level":"B2","type":"practice","rule":["Read a full Spiegel Online / Zeit article (800-1000 words). Time: 20 min.","Task: 1-sentence summary per paragraph. Identify: thesis, arguments, counter-arguments, conclusion.","Unknown words → flashcards (aim for ≤10 per article — if more, the text is too hard).","Write 300-word critical response: agree/disagree with 2 points, justify."],"examples":[],"drills":[]},"commerce-1":{"level":"B2","rule":["Commerce/logistics core vocab: die Bestellung (order), die Lieferung (delivery), die Rechnung (invoice), die Ware (goods), der Lagerbestand (stock), der Versand (shipping), die Sendungsverfolgung (tracking), der Frachtbrief (waybill), der Zoll (customs), die Einfuhr (import), die Ausfuhr (export), Incoterms (FOB, CIF, DAP), das Angebot (quote), die Anfrage (enquiry), die Lieferfrist (delivery time).","Order email: Hiermit bestellen wir folgende Ware: … / Bitte senden Sie uns die Ware innerhalb von 14 Tagen zu.","Verbs: bestellen, liefern, versenden, in Rechnung stellen, verzollen, sich verspäten, nachbestellen."],"examples":["Vielen Dank für Ihre Anfrage. Hiermit machen wir Ihnen folgendes Angebot:","Bitte teilen Sie uns die voraussichtliche Lieferfrist mit.","Die Sendung ist auf dem Weg und kann verfolgt werden."],"drills":[{"prompt":"Wir bestellen folgende ___ (goods):","answer":"Ware"},{"prompt":"Bitte senden Sie uns die Rechnung / die ___ (invoice).","answer":"Rechnung"},{"prompt":"Die Lieferung hat sich um 3 Tage ___. (delayed)","answer":"verspätet"},{"prompt":"Die Sendung kann man ___ (track).","answer":"verfolgen"}]},"commerce-2":{"level":"B2","rule":["Complaint (Reklamation/Beschwerde): Sehr geehrte Frau X, hiermit reklamiere ich… / Die gelieferte Ware ist beschädigt/unvollständig. Ich bitte Sie, umgehend… / Ich fordere Sie auf, … / Sollte dies nicht innerhalb von 14 Tagen geschehen, behalte ich mir vor…","Offer (Angebot): Vielen Dank für Ihre Anfrage vom… Wir bieten Ihnen an: … zu einem Preis von… gültig bis… / Unser Angebot freibleibend.","Deadline/reminder (Mahnung): Wir erinnern Sie an die fällige Rechnung vom… / Bitte überweisen Sie den Betrag innerhalb von 10 Tagen.","Polite but firm. Use Konjunktiv II for requests: Ich würde Sie bitten, …"],"examples":["Hiermit reklamiere ich die am 10.09. gelieferte Ware.","Ich würde Sie bitten, die Ware umgehend auszutauschen.","Unser Angebot ist freibleibend und gültig bis zum 30.09."],"drills":[{"prompt":"Hiermit ___ ich die gelieferte Ware. (complain about)","answer":"reklamiere"},{"prompt":"Ich ___ Sie bitten, umgehend zu handeln. (würde)","answer":"würde"},{"prompt":"Unser Angebot ist freibleibend und ___ bis zum 30.9. (valid)","answer":"gültig"},{"prompt":"Bitte überweisen Sie den ___ innerhalb von 10 Tagen. (amount)","answer":"Betrag"}]},"grafik-beschreibung":{"level":"B2","rule":["Graph description structure: Einleitung (was zeigt die Grafik? Quelle, Jahr) → Überblick (Haupttrend) → Details (Zahlen, Vergleiche) → Fazit.","Trend verbs: steigen (ansteigen, zunehmen), sinken (abnehmen, zurückgehen), sich verdoppeln/verdreifachen, stagnieren, auf einem Hoch/Tief stehen, einen Spitzenwert erreichen, leicht/stark ansteigen.","Prepositions with numbers: um 10% (by), auf 20% (to), von 10% auf 20% (from…to), bei 20% liegen (stand at), im Vergleich zu/in Vergleich mit (compared to).","Phrases: Man sieht deutlich, dass… / Auffällig ist, dass… / Im Vergleich zum Vorjahr… / Der größte Anteil entfällt auf…"],"examples":["Die Grafik zeigt die Arbeitslosigkeit in Deutschland von 2010 bis 2024.","Die Arbeitslosigkeit ist von 8% auf 3% gesunken.","Der größte Anteil entfällt auf die Altersgruppe der 25- bis 35-Jährigen."],"drills":[{"prompt":"Die Zahl ist ___ 10% auf 20% gestiegen. (from)","answer":"von"},{"prompt":"Sie ist um 5% ___ (decreased).","answer":"gesunken / zurückgegangen"},{"prompt":"Der größte ___ entfällt auf die Jugendlichen. (share)","answer":"Anteil"},{"prompt":"Die Zahl ___ bei 20%. (stands at)","answer":"liegt"}]},"essay-struktur":{"level":"B2","rule":["B2 essay (Goethe/TELC): 300-400 words, 45-60 min. Structure: 1) Einleitung (introduce topic, state importance), 2) Hauptteil (arguments pro + contra, each with example), 3) Schluss (your opinion + conclusion).","Each argument: claim → reason → example. Use connectors: Zunächst…, Außerdem…, Darüber hinaus…, Einerseits…/Andererseits…, Dennoch…, Folglich…","Opinion essay (Meinung): state your view clearly, support with 2-3 arguments, acknowledge counter-argument, conclude.","Graph+opinion (TELC): describe graph (1/3) then discuss (2/3). Link: Dieser Trend lässt sich dadurch erklären, dass…"],"examples":["Einleitung: Das Thema X ist in aller Munde. Es stellt sich die Frage, ob…","Ein Argument dafür ist… Zum Beispiel…","Zusammenfassend bin ich der Meinung, dass…"],"drills":[{"prompt":"Essay structure: Einleitung → ___ → Schluss.","answer":"Hauptteil"},{"prompt":"Each argument: claim → ___ → example.","answer":"reason / Begründung"},{"prompt":"Dieser Trend lässt sich dadurch ___, dass… (explain)","answer":"erklären"}]},"b2-listening":{"level":"B2","type":"practice","rule":["Native-speed podcast (Tagesschau in 100 Sekunden / Coffee Break German advanced). Listen 3x: 1) gist, 2) notes, 3) check transcript.","Target: understand ≥80% without transcript. If <60%, drop back to Easy German for a week.","Note 5 new collocations/idioms → flashcards."],"examples":[],"drills":[]},"error-log":{"level":"B2","type":"practice","rule":["Go through ALL your written work from the past 3 months. Extract every mistake.","Categorize: case ending / word order / article / preposition / collocation / spelling.","Each mistake → one flashcard (front: wrong sentence with gap, back: correct + rule). Rate 'Again' — these are your highest-yield cards."],"examples":[],"drills":[]},"b2-mock-1":{"level":"B2","type":"practice","rule":["Full Goethe/TELC B2 mock, timed, all sections. Score. Identify top 3 gaps → become gap-1/2/3 days."],"examples":[],"drills":[]},"gap-1":{"level":"B2","type":"practice","rule":["Targeted drill on gap #1 from mock: 50 exercises, 100% mastery required. Teach the rule to your speaking group."],"examples":[],"drills":[]},"gap-2":{"level":"B2","type":"practice","rule":["Targeted drill on gap #2: 50 exercises. Write 20 original sentences using it correctly."],"examples":[],"drills":[]},"gap-3":{"level":"B2","type":"practice","rule":["Targeted drill on gap #3: 50 exercises. Rewrite 5 old sentences that got it wrong."],"examples":[],"drills":[]},"b2-vocab-sprint":{"level":"B2","type":"practice","rule":["Learn 150 abstract/academic words (B2 frequency). Add to SM-2. Use 15 in a 300-word essay."],"examples":[],"drills":[]},"b2-shadowing":{"level":"B2","type":"practice","rule":["Shadowing: play 30s native audio, pause, repeat EXACTLY mimicking intonation/rhythm. Record, compare. Do 5 rounds. This fixes pronunciation + fluency."],"examples":[],"drills":[]},"commerce-3":{"level":"B2","type":"practice","rule":["Deep-dive YOUR Ausbildung field: build glossary of 50 technical terms. Explain your job/daily work in German (3 min) to your speaking group."],"examples":[],"drills":[]},"b2-mock-2":{"level":"B2","type":"practice","rule":["Full B2 mock #2, timed. Compare score to mock #1. If gap areas remain, they become final-gap days."],"examples":[],"drills":[]},"essay-opinion":{"level":"B2","type":"practice","rule":["Write 2 timed opinion essays (350 words, 45 min each). Self-grade: structure, arguments, connectors, grammar. Use the exact template."],"examples":[],"drills":[]},"essay-grafik":{"level":"B2","type":"practice","rule":["2 timed graph-description + opinion tasks (TELC format). Graph description ≤1/3 of essay. Link graph to discussion."],"examples":[],"drills":[]},"formal-letters":{"level":"B2","type":"practice","rule":["3 timed formal letters (20 min each): enquiry, complaint, application. Memorize the fixed phrases for opening/closing."],"examples":[],"drills":[]},"listening-technique":{"level":"B2","type":"practice","rule":["Exam technique: read questions BEFORE listening, predict answers (part of speech, type of info). 3 timed sections. Review every wrong answer."],"examples":[],"drills":[]},"reading-technique":{"level":"B2","type":"practice","rule":["Skim (1 min) for gist, then scan for keywords. Don't read every word. 3 timed sections. Log unknown words."],"examples":[],"drills":[]},"vocab-catchup":{"level":"B2","type":"practice","rule":["No new words. Pure SM-2 review — clear the entire backlog. Lapsed cards get 'Again'. Aim: zero overdue cards by end of day."],"examples":[],"drills":[]},"b2-mock-3":{"level":"B2","type":"practice","rule":["Full mock #3, exam conditions (no phone, timed, silence). Score. Target ≥65%."],"examples":[],"drills":[]},"final-gap-1":{"level":"B2","type":"practice","rule":["Final targeted drill on gap #1. Mastery. Explain to group."],"examples":[],"drills":[]},"final-gap-2":{"level":"B2","type":"practice","rule":["Final targeted drill on gap #2. Mastery. 20 original sentences."],"examples":[],"drills":[]},"final-gap-3":{"level":"B2","type":"practice","rule":["Final targeted drill on gap #3. Mastery. Rewrite old essays."],"examples":[],"drills":[]},"speaking-b2":{"level":"B2","type":"practice","rule":["Prepare 5 monologue topics (3 min each): your field, a social issue, your city, technology, learning languages. Deliver to group + get feedback."],"examples":[],"drills":[]},"writing-speed":{"level":"B2","type":"practice","rule":["2 essays back-to-back, 40 min each, no dictionary. Build stamina. Self-grade only for structure + major errors."],"examples":[],"drills":[]},"final-vocab":{"level":"B2","type":"practice","rule":["Final pass on high-yield connectors + essay phrases. Build a 1-page cheat sheet of 50 must-use phrases. Memorize."],"examples":[],"drills":[]},"b2-mock-4":{"level":"B2","type":"practice","rule":["Full mock #4. Score. Target ≥70%. Remaining gaps → final-gap-4/5."],"examples":[],"drills":[]},"final-gap-4":{"level":"B2","type":"practice","rule":["Final drill gap #4. Rewrite 2 essays with the fix."],"examples":[],"drills":[]},"final-gap-5":{"level":"B2","type":"practice","rule":["Final drill gap #5. Explain the rule to your speaking group."],"examples":[],"drills":[]},"commerce-final":{"level":"B2","type":"practice","rule":["Final pass on your field glossary (80 terms). Explain a work process in German, recorded. Listen back, fix."],"examples":[],"drills":[]},"speed-drill":{"level":"B2","type":"practice","rule":["2 timed listening + reading sections back-to-back. Only review errors — no new content."],"examples":[],"drills":[]},"writing-final":{"level":"B2","type":"practice","rule":["1 essay (350w, 45min) + 1 formal letter (20min). Self-grade against rubric. Should be near-exam quality."],"examples":[],"drills":[]},"speaking-final":{"level":"B2","type":"practice","rule":["Full B2 oral exam simulation with group: monologue + discussion + feedback, recorded. This is your dress rehearsal."],"examples":[],"drills":[]},"b2-mock-5":{"level":"B2","type":"practice","rule":["Full mock #5, final benchmark. Target ≥70%. If below, focus ONLY on weak cards + templates in remaining days."],"examples":[],"drills":[]},"light-review-1":{"level":"B2","type":"practice","rule":["Rest day: only lapsed/weak cards (≤30 min). Light reading. No new content, no heavy grammar."],"examples":[],"drills":[]},"light-review-2":{"level":"B2","type":"practice","rule":["Recite essay + letter templates from memory. Write one skeleton essay. Early sleep."],"examples":[],"drills":[]},"b2-mock-6":{"level":"B2","type":"practice","rule":["Final full simulation. Confidence-building. Don't study the score — study your mindset."],"examples":[],"drills":[]},"speaking-marathon":{"level":"B2","type":"practice","rule":["2h group = full speaking exam format, recorded. Focus: fluency, not perfection."],"examples":[],"drills":[]},"rest-1":{"level":"B2","type":"practice","rule":["Rest. 30 min max light vocab review. Go for a walk. Your brain needs consolidation."],"examples":[],"drills":[]},"rest-2":{"level":"B2","type":"practice","rule":["Passive German only: podcasts, music, shows. No active study. Enjoy it."],"examples":[],"drills":[]},"final-review":{"level":"B2","type":"practice","rule":["Final pass: cheat sheet, templates, weak cards. Pack your bag. Early sleep. You're ready."],"examples":[],"drills":[]},"warmup-1":{"level":"B2","type":"practice","rule":["Light warm-up: 30 min review + 1 short essay (200 words). Relax. Don't cram."],"examples":[],"drills":[]},"exam-logistics":{"level":"B2","type":"practice","rule":["Confirm: exam time, location, ID documents, pens, water. Plan your route. Early sleep. No new content."],"examples":[],"drills":[]},"exam-day":{"level":"B2","type":"practice","rule":["EXAM DAY. Arrive early. Breathe. You've done 116 days of consistent work — trust the process. Viel Erfolg!"],"examples":[],"drills":[]},"post-exam":{"level":"B2","type":"practice","rule":["Celebrate. Maintenance plan: 20 min/day SM-2 review + weekly speaking group. Start C1 in 1 month if you want."],"examples":[],"drills":[]},"review-w1":{"level":"A1","type":"practice","rule":["Review week 1: articles, Akkusativ, present tense, modals. 20-min self-test. Record 2-min self-intro."],"examples":[],"drills":[]},"review-w2":{"level":"A1","type":"practice","rule":["A1 mock: reading + writing. Fill gaps. Write 150 words about your life."],"examples":[],"drills":[]},"review-w3":{"level":"A2","type":"practice","rule":["A2 progress check: Dativ, Perfekt, separable/reflexive, comparatives. Error log."],"examples":[],"drills":[]},"review-w5":{"level":"B1","type":"practice","rule":["B1 grammar check: subordinate clauses, relative, passive, KII. 50 gap-fills."],"examples":[],"drills":[]},"review-w7":{"level":"B1","type":"practice","rule":["Error log consolidation. Rewrite worst essay. Teach weakest rule to group."],"examples":[],"drills":[]},"review-w9":{"level":"B2","type":"practice","rule":["B2 entry check: passive, KII full, connectors, NVV. Opinion essay (300 words)."],"examples":[],"drills":[]},"review-w10":{"level":"B2","type":"practice","rule":["Vocab sprint: commerce/logistics begins. 50 field terms. Describe your ideal job (250 words)."],"examples":[],"drills":[]}}};</script>
<script>
(function(){
"use strict";
var D = window.APP_DATA;
var $ = function(id){return document.getElementById(id)};
var cards = D.cards.map(function(c,i){return {id:i, front:c.f, back:c.b, article:c.a, part_of_speech:c.p, example_de:c.e, level:c.l, introduced_day:c.d}});
var curriculum = D.curriculum, grammar = D.grammar;

// ---- SM-2 engine ----
var RATING={AGAIN:1,HARD:2,GOOD:3,EASY:4};
function toISO(d){var x=d instanceof Date?d:new Date(d);return x.toISOString().slice(0,10)}
function addDays(iso,n){var d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return toISO(d)}
function clampEase(ef){return Math.max(1.3,Math.round(ef*100)/100)}
function initialState(){return{reps:0,interval_days:0,ease_factor:2.5,due_at:toISO(new Date()),lapses:0,last_rating:null}}
function rate(state,rating,today){
  var t=toISO(today||new Date());var reps=state.reps,iv=state.interval_days,ef=state.ease_factor,lapses=state.lapses;
  if(rating===1){lapses++;reps=0;iv=1;ef=clampEase(ef-0.2);return{next:{reps:reps,interval_days:iv,ease_factor:ef,lapses:lapses,last_rating:rating,due_at:addDays(t,1)},requizToday:true}}
  reps++;var ni;
  if(reps===1)ni=1;else if(reps===2)ni=6;else ni=Math.max(1,Math.round(iv*ef));
  if(rating===2){ni=Math.max(1,Math.round(ni*1.2));ef=clampEase(ef-0.15)}
  else if(rating===4){ni=Math.max(1,Math.round(ni*1.3));ef=clampEase(ef+0.1)}
  return{next:{reps:reps,interval_days:ni,ease_factor:ef,lapses:lapses,last_rating:rating,due_at:addDays(t,ni)},requizToday:false}
}

// ---- store (localStorage) ----
var KEYS={state:"gb2_state",results:"gb2_results",profile:"gb2_profile"};
function read(k,fb){try{return JSON.parse(localStorage.getItem(k))||fb}catch(e){return fb}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
var profile=read(KEYS.profile,{current_day:1,streak_days:0,start_date:null});
if(!profile.start_date){profile.start_date=toISO(new Date());write(KEYS.profile,profile)}
var states=read(KEYS.state,[]);
function upsert(cardId,next){var s=read(KEYS.state,[]);var i=s.findIndex(function(x){return x.card_id===cardId});var row={card_id:cardId};for(var k in next)row[k]=next[k];if(i>=0)s[i]=row;else s.push(row);write(KEYS.state,s);states=s}
